[project]
name = "archagenticrag"
version = "0.2.0"
description = "Learning/portfolio Agentic RAG project built by composing existing open-source components."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    # Phase 1 Basic RAG. Versions verified together on 2026-10-01
    # (see docs/PHASE-1-REUSE-AUDIT.md).
    "langgraph==1.2.12",
    "langchain-openai==1.6.7",          # ChatOpenAI for every OpenAI-compatible provider (incl. Ollama)
    "langchain-qdrant==1.1.0",
    "qdrant-client==1.19.1",            # matches the qdrant/qdrant:v1.19.1 server image
    "fastembed==0.8.1",                 # local ONNX embeddings (via langchain-community FastEmbedEmbeddings)
    "docling-slim[convert-core,feat-chunking,format-html]==2.131.0",
    "docutils>=0.23,<0.24",             # PEP reader: reStructuredText -> HTML (Docling has no RST backend)
]

[project.optional-dependencies]
# Phase 2 evaluation stack. Versions verified together on 2026-10-01
# (see docs/research/PHASE-2-EVALUATION-REUSE-AUDIT.md).
eval = [
    "ragas==0.4.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, which was
    # removed in langchain-community 0.4.x. Keep below 0.4 until ragas ships a fix.
    "langchain-community>=0.3.31,<0.4",
    "langfuse==4.16.0",
    "openai>=2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archagenticrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls real model providers or a live Langfuse server (deselected by default)",
    "integration: needs the Qdrant server (docker compose up -d qdrant) and model downloads (deselected by default)",
]
addopts = "-m 'not live and not integration'"

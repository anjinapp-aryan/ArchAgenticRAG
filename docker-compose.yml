# Local infrastructure. Phase 1 needs only Qdrant.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1   # matches qdrant-client 1.19.1
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
